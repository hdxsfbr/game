<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Listening Kingdom</title>
    <!-- Shown by the page itself until the game's script has loaded and the title appears: the engine
         bundle takes a few seconds on a slow connection, and a white page looked broken. -->
    <style>
      html, body { margin: 0; background: #15141a; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #d9d2c4; font: italic 18px Georgia, 'Times New Roman', serif; }
      #boot h1 { margin: 0 0 6px; font: normal 34px Georgia, 'Times New Roman', serif; color: #f6efe2; letter-spacing: 0.02em; }
      #boot .notes { display: flex; gap: 10px; }
      #boot .notes i { width: 12px; height: 12px; border-radius: 50%; background: #f2c46d; animation: boot-bounce 1.1s ease-in-out infinite; }
      #boot .notes i:nth-child(2) { animation-delay: 0.12s; }
      #boot .notes i:nth-child(3) { animation-delay: 0.24s; }
      #boot .notes i:nth-child(4) { animation-delay: 0.36s; }
      #boot .notes i:nth-child(5) { animation-delay: 0.48s; }
      @keyframes boot-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-14px); opacity: 1; } }
    </style>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315141a'/%3E%3Cellipse cx='12' cy='22' rx='6' ry='4' fill='%23f2c46d'/%3E%3Crect x='16' y='6' width='3' height='17' fill='%23f2c46d'/%3E%3Crect x='16' y='6' width='9' height='3' fill='%23f2c46d'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <h1>The Listening Kingdom</h1>
      <div class="notes"><i></i><i></i><i></i><i></i><i></i></div>
      <p>Waking the kingdom…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
